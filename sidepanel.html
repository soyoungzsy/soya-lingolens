<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soya LingoLens</title><link rel="stylesheet" href="ui.css"></head><body class="panel"><header class="top"><div><p class="eyebrow">ENGLISH READING COMPANION</p><h1>Soya LingoLens</h1></div><button id="settings" class="icon" title="设置">⚙</button></header><section class="stats"><div><b id="total">0</b><span>条记录</span></div><div><b id="words">0</b><span>个词语</span></div><div><b id="favorites">0</b><span>已收藏</span></div></section><div class="tools"><label class="search"><span>⌕</span><input id="query" type="search" placeholder="搜索英文、中文或网页"></label><select id="filter" aria-label="筛选记录"><option value="all">全部</option><option value="favorite">收藏</option><option value="unmastered">待复习</option></select></div><main id="records"></main><template id="record-template"><article class="record"><div class="record-head"><span class="kind"></span><time></time><button class="favorite" title="收藏">☆</button></div><div class="original-row"><h2 class="original"></h2><button class="speak" title="美式女声朗读">▶</button></div><p class="meta"></p><p class="translation"></p><p class="note"></p><a class="source" target="_blank" rel="noreferrer"></a><div class="record-actions"><button class="master">标为已掌握</button><button class="delete">删除</button></div></article></template><script type="module" src="sidepanel.js"></script></body></html>
