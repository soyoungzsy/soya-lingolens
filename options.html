<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soya LingoLens 设置</title><link rel="stylesheet" href="ui.css"></head><body class="options"><main><p class="eyebrow">SOYA LINGOLENS · 设置</p><h1>选择你愿意分享多少语境</h1><p class="lede">默认服务无需密钥，适合先体验；OpenAI 更擅长结合上下文，但会产生 API 费用。</p><form id="form"><fieldset><legend>翻译方式</legend><label class="choice"><input type="radio" name="provider" value="mymemory"><span><b>免费基础翻译</b><small>使用 MyMemory；单词释义来自 Free Dictionary API。适合日常短句，复杂语境能力有限。</small></span></label><label class="choice"><input type="radio" name="provider" value="openai"><span><b>OpenAI 语境翻译</b><small>把选中文字和可选的附近语境发送给 OpenAI。按 API 实际用量收费。</small></span></label></fieldset><section id="openai-fields"><label>OpenAI API Key<input id="api-key" type="password" autocomplete="off" placeholder="sk-…"></label><label>模型<input id="model" type="text" placeholder="gpt-4o-mini"></label><p class="hint">密钥仅存储在本机 Chrome 的扩展存储中，不会写入代码或同步到本项目。</p></section><fieldset><legend>阅读习惯</legend><label class="toggle"><input id="auto" type="checkbox"><span>选中后立即翻译</span></label><label class="toggle"><input id="save" type="checkbox"><span>翻译成功后自动存入复习</span></label><label class="toggle"><input id="context" type="checkbox"><span>发送附近段落以改善语境翻译</span></label></fieldset><div class="privacy"><b>隐私提示</b><p>无论选择哪种在线服务，选中的英文都会发送给第三方。开启“附近段落”后，页面中相邻文字也会发送。请勿在邮箱、内部系统、财务或含个人信息的页面使用。</p></div><button class="primary" type="submit">保存设置</button><span id="status" role="status"></span></form></main><script type="module" src="options.js"></script></body></html>
